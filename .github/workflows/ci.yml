name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix test
      - run: bash test/cli_test.sh
      # Builds the escript and runs it end to end. The escript is the
      # distribution artifact and is not exercised by mix test (issue #130).
      - run: bash test/escript_test.sh

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: '27'
          elixir-version: '1.18'
      - run: mix deps.get

      # A cold PLT build takes several minutes; a warm one is seconds. The key
      # is tied to the OTP/Elixir pair because a PLT is not portable across
      # them, and to mix.lock because the PLT includes the deps' modules. The
      # restore-key lets a stale PLT be reused and incrementally updated rather
      # than rebuilt from scratch when only mix.lock moved.
      - uses: actions/cache@v4
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix credo --strict
      - run: mix dialyzer --format github
